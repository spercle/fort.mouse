# GitHub Pages serves project sites from a subpath, so every internal URL
# must go through relURL. Override locally with:  hugo server --baseURL /
baseURL = "https://spercle.github.io/fort.mouse/"
locale = "en-us"
title = "The.Fort"

# Hugo sees ONLY data/resolved/, mounted as its data directory. The rest of data/ is
# the pipeline's working material — machine-owned loops, human-owned seeds, reference
# GeoJSON — and Hugo has no business parsing any of it.
# Regenerate the mounted output with: python3 pipeline/build_data.py
[[module.mounts]]
  source = "data/resolved"
  target = "data"

# Where guests write in. Both are optional: leave one blank and the link that uses it
# is not rendered at all, rather than shipping a mailto: nobody reads. The photo
# address is the only inbound path the ingest pipeline has, so a dead one is worse
# than an absent one.
[params]
  photo_email = "photos@example.invalid"
  corrections_email = "corrections@example.invalid"

disableKinds = ["taxonomy", "term", "rss"]
enableRobotsTXT = true

[permalinks]
  site = "/site/:slug/"
  loop = "/loop/:slug/"

[markup.goldmark.renderer]
  unsafe = true

# campground's only two pull-through sites are in Loop 1200. That claim traces to
# a fan FAQ last updated in 2009 and no source has ever named the two sites.
# Measuring this loop settles it.
open_questions:
  - id: pull-throughs
    claim: Two pull-through sites exist in Loop 1200
    status: unverified
    earliest_source: jlspence FW FAQ, last updated 2009

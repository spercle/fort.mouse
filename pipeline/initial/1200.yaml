# Loop 1200 — Dogwood Drive
#
# SEED — nothing here is measured yet. Regenerate from digitized pads with:
#   python3 pipeline/derive.py 1200 work/loop-1200-pads.geojson
# MACHINE-OWNED. Human notes live in data/sites/*.md. See ADR-0002.

loop: 1200
loop_name: Dogwood Drive
category: Premium
generated: 2026-09-02
status: unmeasured

# Disney's published Category maximum. NOT a measurement of any Site.
category_baseline:
  pad_length_ft: 60
  pad_width_ft: 18
  sewer: true
  max_occupancy: 8          # effective for arrivals from 2026-01-01
  source: disney-category

# Loop identity and segmentation from Orange County's public address-range
# record — not from any fan map. See ADR-0001.
county_record:
  source: county-record
  service: ocgis4.ocfl.net/arcgis/rest/services/AGOL_Open_Data/MapServer/1
  zipcode: 32830
  retrieved: 2026-09-02
  segments:
    - theoretical_left: [1200, 1210]
      theoretical_right: [1201, 1211]
      from: "Tumbleweed Turn"
      to: "Dogwood Dr"
      length_ft: 102.3
    - theoretical_left: [1212, 1250]
      theoretical_right: [1213, 1251]
      from: "Dogwood Dr"
      to: "Dogwood Dr"
      length_ft: 573.9
    - theoretical_left: [1252, 1298]
      theoretical_right: [1253, 1299]
      from: "Dogwood Dr"
      to: "Dogwood Dr"
      length_ft: 244.6
  caveat: >-
    ACTUAL ranges are 0 in the source, so only THEORETICAL block allocations are
    known. Even-left/odd-right is the county's own convention and is NOT Disney's
    site numbering. These segments locate and order sites; they do not name them.

road_length_ft_osm: 828.3        # OSM way/43161203, oneway
road_length_ft_county: 920.8     # 3 county segments, incl. the Tumbleweed Turn stub

# 22 sites is TouringPlans' count and is not authoritative; totals for the
# campground are contested across every published source.
expected_site_count: 22

# HYPOTHESIS ONLY. Loops are documented as numbering sequentially from N01, so
# 1201-1222 is the expectation — not an observation. Digitizing confirms or
# refutes it, and every entry stays number_confidence: hypothesis until it does.
site_count: 0

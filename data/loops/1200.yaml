# Loop 1200 — Dogwood Drive
#
# SEED — nothing here is measured. Regenerate from digitized pads with:
#   python3 pipeline/derive.py 1200 work/loop-1200-pads.geojson
# MACHINE-OWNED. Human notes live in data/sites/*.md. See ADR-0002.

loop: 1200
loop_name: Dogwood Drive
category: Premium
generated: 2026-09-02
status: unmeasured

# Disney's published Category maximum. NOT a measurement of any Site.
category_baseline:
  pad_length_ft: 60
  pad_width_ft: 18
  sewer: true
  max_occupancy: 8          # effective for arrivals from 2026-01-01
  source: disney-category

# Loop identity and number blocks from Orange County's public
# address-range record — not from any fan map. See ADR-0001.
county_record:
  source: county-record
  service: ocgis4.ocfl.net/arcgis/rest/services/AGOL_Open_Data/MapServer/1
  retrieved: 2026-09-02
  segments:
    - theoretical_left: [1212, 1250]
      theoretical_right: [1213, 1251]
      from: "Dogwood Dr"
      to: "Dogwood Dr"
      length_ft: 573.9
  caveat: >-
    ACTUAL ranges are 0 in the source, so only THEORETICAL block
    allocations are known. Even-left/odd-right is the county's own
    convention and is NOT Disney's site numbering.

road_length_ft_osm: 828.3

# Count is TouringPlans' and is not authoritative; campground totals are
# contested across every published source.
expected_site_count: 22


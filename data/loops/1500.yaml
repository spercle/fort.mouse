      to: "Cottontail Curl"
      length_ft: 48.8
    - theoretical_left: [1412, 1450]
      theoretical_right: [1411, 1451]
      from: "Cottontail Curl"
      to: "Cottontail Curl"
      length_ft: 411.5
    - theoretical_left: [1452, 1500]
      theoretical_right: [1453, 1499]
      from: null
      to: null
      length_ft: 442.8
  caveat: >-
    ACTUAL ranges are 0 in the source, so only THEORETICAL block
    allocations are known. Even-left/odd-right is the county's own
    convention and is NOT Disney's site numbering.
  block_mismatch: >-
    The county files this street under a block that does not match loop
    1500. The street name identifies the loop; the county's block
    numbering is its own and is known to be inconsistent here.

road_length_ft_osm: 825.9


# Loop 1900 — Wagon Wheel Way
#
# SEED — nothing here is measured. Regenerate from digitized pads with:
#   python3 pipeline/derive.py 1900 work/loop-1900-pads.geojson
# MACHINE-OWNED. Human notes live in data/sites/*.md. See ADR-0002.

loop: 1900
loop_name: Wagon Wheel Way
category: Full Hook-Up
generated: 2026-09-02
status: unmeasured

# Disney's published Category maximum. NOT a measurement of any Site.
category_baseline:
  pad_length_ft: 50
  pad_width_ft: 10
  sewer: true
  max_occupancy: 8          # effective for arrivals from 2026-01-01
  source: disney-category

# Loop identity and number blocks from Orange County's public
# address-range record — not from any fan map. See ADR-0001.
county_record:
  source: county-record
  service: ocgis4.ocfl.net/arcgis/rest/services/AGOL_Open_Data/MapServer/1
  retrieved: 2026-09-02
  segments:
    - theoretical_left: [1852, 1898]
      theoretical_right: [1853, 1899]
      from: "Hickory Hollow, Timber Trl"
      to: "Conestoga Trl"
      length_ft: 423.1
    - theoretical_left: [1901, 1951]
      theoretical_right: [1900, 1950]
      from: "Wagon Wheel Way"
      to: "Wagon Wheel Way"
      length_ft: 629.4
  caveat: >-
    ACTUAL ranges are 0 in the source, so only THEORETICAL block
    allocations are known. Even-left/odd-right is the county's own
    convention and is NOT Disney's site numbering.
  block_mismatch: >-
    The county files this street under a block that does not match loop
    1900. The street name identifies the loop; the county's block
    numbering is its own and is known to be inconsistent here.

road_length_ft_osm: 1310.1

# Count is TouringPlans' and is not authoritative; campground totals are
# contested across every published source.
expected_site_count: 38

# HYPOTHESIS ONLY. Loops are documented as numbering sequentially from N01,
# so this roster is an expectation, not an observation.
site_count: 0
